<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../css/main.css">
	<link rel="stylesheet" href="../css/admin/main.css">
	<link rel="icon" type="image/png" href="../imgs/aery-logo.png">
	<title>Gesti&oacute;n de galer&iacute;as</title>
</head>
<body>
	<header class="admin-header">
		<hgroup class="main-title">
			<button class="btn-previous-view" hidden>
				<h1 class="fas fa-angle-left"></h1>
			</button>
			<h1 class="view-title">Galer&iacute;as</h1>
		</hgroup>

		<form id="frm-search-galleries" action="#" novalidate>
			<input type="search" id="search-gallery" maxlength="60" autocomplete="off" placeholder="Buscar galer&iacute;a">
		</form>

		<div class="header-actions">
			<button class="btn" id="btn-notifications">
				<i class="fas fa-bell"></i>
			</button>

			<button class="btn" id="btn-new-gallery">
				<span>Nueva galer&iacute;a</span>
				<i class="fas fa-plus"></i>
			</button>

			<button class="btn" id="btn-get-link" hidden>
				<span>Obtener enlace</span>
				<i class="fas fa-link"></i>
			</button>
		</div>
	</header>

	<main>
		<section class="filters-panel" hidden>
			<button class="btn btn-filter" id="btn-status-filter">
				<span>Estado</span>
				<i class="fas fa-caret-down"></i>
			</button>

			<button class="btn btn-filter" id="btn-date-filter">
				<span>Fecha</span>
				<i class="fas fa-caret-down"></i>
			</button>
		</section>

		<section id="dashboard">
			<aside class="sidebar" hidden>
				<div class="cover-container">
					<img src="/assets/carousel/gigi5.jpg">
				</div>

				<section class="sidebar-actions">
					<div class="action-container is-active">
						<span class="btn-setting">
							<i class="fas fa-image"></i>
						</span>
					</div>
					<div class="action-container">
						<span class="btn-setting">
							<i class="fas fa-paintbrush"></i>
						</span>
					</div>
					<div class="action-container">
						<span class="btn-setting">
							<i class="fas fa-gear"></i>
						</span>
					</div>
					<div class="action-container">
						<span class="btn-setting">
							<i class="fas fa-wifi"></i>
						</span>
					</div>
				</section>

				<section class="active-action-main">
					<h3 id="active-action-title">Highlights</h3>
					<article class="active-action-content">
						<div>
							Preview
							<!-- Mas un texto que esta mas que comprobado que no cabe para ver como se va a comportar el contenedor de este texto. -->
						</div>
						<span><i class="fas fa-check"></i></span>
					</article>
				</section>
			</aside>

			<aside id="dashboard-content-view">
				<article id="galleries" hidden>
					<div class="card-wrapper">
						<div class="card">
							<img src="/assets/carousel/gigi1.jpg">
						</div>

						<div class="card-presentation">
							<div class="lock-icon">
								<i class="fas fa-lock"></i>
							</div>

							<div class="card-title">
								Gigi
							</div>
						</div>

						<div class="card-metadata">
							<span class="status-icon is-published">
								<i class="fas fa-circle"></i>
							</span>

							<p class="card-info">
								6 fotos | Jul 15, 2026 
							</p>
						</div>
					</div>

							<div class="card-title">

							<span class="status-icon">
								<i class="fas fa-circle"></i>
							</span>

							<p class="card-info">
								0 fotos | Jul 15, 2026 
							</p>
						</div>
					</div>
				</article>

				<article id="new-gallery-view">
					<form action="#" id="frm-new-gallery" novalidate>
						<fieldset>
							<legend>
								<h1>Crea una nueva galer&iacute;a.</h1>
							</legend>

							<label for="txt-client-name" class="form-field">
								<input type="text" name="txt-client-name" id="txt-client-name" autocomplete="off" placeholder="Nombre del cliente" required>
							</label>

							<label for="txt-gallery-name" class="form-field">
								<input type="text" name="txt-gallery-name" id="txt-gallery-name" autocomplete="off" placeholder="Nombre de galer&iacute;a" required>
							</label>

							<label for="txta-gallery-description" class="form-field">
								<textarea name="txta-gallery-description" id="txta-gallery-description" maxlength="200" placeholder="Descripci&oacute;n de la galer&iacute;a"></textarea>
							</label>

							<button type="button" class="form-button">
